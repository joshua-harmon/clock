 const t=now();if(VIEW=='codex'){drawCodex(t);return}g.save();g.translate(0,24);drawClock(t);g.restore();drawBoard(t);if(!yahOff){g.save();g.font='15px sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#000';const Q=.8,qw=CW*Q,qh=RH*Q,tw=g.measureText('you are here').width,gap=10,tot=tw+gap+qw,x0=1356+(154-tot)/2,yc=BY+BOARD_DROP+3.5*RH;g.fillText('you are here',x0,yc);const sx=x0+tw+gap,sy=yc-qh/2;g.strokeStyle='#000';g.lineWidth=1;g.strokeRect(sx,sy,qw,qh);g.strokeStyle=KINSQ;g.lineWidth=2.5*Q;g.strokeRect(sx+2*Q,sy+2*Q,qw-4*Q,qh-4*Q);g.font='13px sans-serif';g.fillStyle='#555';const cw=g.measureText('click me').width;g.fillText('click me',x0+(tw-cw)/2,yc+18);yahBox=[x0-4,sy-4,sx+qw+4,yc+27];g.restore()}else{const Jt=jdnOf(t),w=dateGlyphs(Jt,0,0,false),yc=BY+BOARD_DROP+3.5*RH,gy=yc-31;dateGlyphs(Jt,1433-w/2,gy);g.save();g.font='14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText(new Date((Jt-2440588)*864e5).toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'}),1433,gy+26.5+4+8);g.fillText(tzs(Jt),1433,gy+26.5+4+8+17);g.restore()}
 g.fillStyle='#6f9a78';g.font='17px sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillText('THE TZOLKIN TODAY',40,21);
}

const kNow=()=>Math.min(innerWidth/1535,innerHeight/761),inYah=e=>{if(VIEW!='main'||yahOff||!yahBox)return false;const k=kNow(),x=e.clientX/k,y=e.clientY/k;return x>=yahBox[0]&&x<=yahBox[2]&&y>=yahBox[1]&&y<=yahBox[3]};
cv.addEventListener('click',e=>{if(inYah(e)){yahOff=true;cv.style.cursor='';draw()}});cv.addEventListener('mousemove',e=>{cv.style.cursor=inYah(e)?'pointer':''});
const inp=document.getElementById('i');inp.onkeydown=e=>{if(e.key=='Escape'){VIEW='main';draw();return}if(e.key!='Enter')return;const w=inp.value.trim().toLowerCase();inp.value='';
 if(w=='codex'||w=='dresden')VIEW='codex';else if(['tzolkin','board','clock','back','main',''].includes(w))VIEW='main';draw()};
onresize=draw;setInterval(draw,2e4);
