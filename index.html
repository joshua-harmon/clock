function drawAztec(){const cx=468,cy=392,R=360,PI=Math.PI,L=(r,a)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)],ring=r=>{g.beginPath();g.arc(cx,cy,r,0,2*PI);g.stroke()},
  INK='#3a3226',STONE='#e6dcc6',at=(r,a,f,s=1)=>{const[x,y]=L(r,a);g.save();g.translate(x,y);g.rotate(a);g.scale(s,s);f();g.restore()};
 azTitle('THE AZTEC CALENDAR STONE (SUN STONE)',(AZMODE=='photo'?'photograph of the original, Museo Nacional de Antropología  ·  click the photo for full size':'tracing of the carved indents (the photograph needs an internet connection)')+'  ·  mouse wheel: zoom  ·  Escape or aztec calendar to go back');
 if(!AZOK){g.save();g.lineJoin='round';g.lineCap='round';g.strokeStyle=INK;g.fillStyle=INK;
 g.fillStyle=STONE;g.beginPath();g.arc(cx,cy,R,0,2*PI);g.fill();g.fillStyle=INK;g.lineWidth=2;ring(R);ring(R-8);g.lineWidth=1.1;
 for(let i=0;i<120;i++){const[x,y]=L(R-4,i*PI/60);g.beginPath();g.arc(x,y,1.1,0,7);g.fill()} // rim of small stars
 // ---- 1. the two fire serpents, Xiuhcoatl
 const S0=288,S1=R-8;g.lineWidth=1.6;ring(S0);g.lineWidth=1.1;
 for(const s of[-1,1]){const aT=s*0.30,aH=s*(PI-0.30),n=11,da=(aH-aT)/n;
  for(let i=0;i<=n;i++){const a=aT+i*da;g.beginPath();g.moveTo(...L(S0,a));g.lineTo(...L(S1,a));g.stroke()}
  for(let i=0;i<n;i++){const a0=aT+i*da,a1=a0+da,am=(a0+a1)/2;
   // flame block of the body with its curled tip, a jade disc and the paired eyes (stars)
   g.beginPath();g.moveTo(...L(S0+4,a0+da*.12));g.lineTo(...L(S0+26,a0+da*.12));g.lineTo(...L(S0+26,a0+da*.55));g.lineTo(...L(S0+4,a0+da*.55));g.closePath();g.stroke();
