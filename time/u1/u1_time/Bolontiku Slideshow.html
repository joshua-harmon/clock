<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolontiku Slideshow</title>
<style>
  :root { --bg:#05070d; --panel:#0b1220; --line:#22304a; --text:#e6e9f0; --dim:#97a3b8; --gold:#ffd27a; --blue:#7fb2ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .glyphbox { background: #fff; border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: center; height: 170px; }
  .glyphbox img { max-height: 146px; max-width: 100%; image-rendering: auto; }
  .num { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .num b { color: var(--gold); font-size: 30px; letter-spacing: 0; margin-right: 6px; text-transform: none; }
  .caption { font-style: italic; color: var(--gold); font-size: 17px; line-height: 1.35; }
  .facts { font-size: 14px; line-height: 1.5; color: var(--text); }
  .facts div { padding: 6px 0; border-top: 1px solid var(--line); }
  .facts span { color: var(--dim); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .levels { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-top: auto; }
  .levels button { background: #142035; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 7px 0; cursor: pointer; font-size: 12px; }
  .levels button.on { background: var(--gold); color: #1b1300; border-color: var(--gold); font-weight: 700; }
  main { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px 70px 8px; min-height: 0; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.6); opacity: 0; transition: opacity .5s; }
  .stage img.shown { opacity: 1; }
  .title { text-align: center; font-size: 18px; padding: 4px 16px 0; }
  .credit { text-align: center; font-size: 12px; color: var(--dim); padding: 4px 16px 14px; }
  .credit a { color: var(--blue); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,32,53,.75); border: 1px solid var(--line); color: var(--text); width: 46px; height: 46px; border-radius: 50%; font-size: 22px; cursor: pointer; }
  .nav:hover { background: #22304a; }
  .prev { left: 14px; } .next { right: 14px; }
  .bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 16px 16px; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #2a3a58; cursor: pointer; display: block; }
  .dots i.on { background: var(--gold); }
  .play { background: #142035; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .hint { color: var(--dim); font-size: 12px; }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    aside { border-right: none; border-bottom: 1px solid var(--line); padding: 16px; }
    .glyphbox { height: 120px; } .glyphbox img { max-height: 100px; }
    .stage { padding: 12px 16px 6px; height: 60vh; }
    .nav { top: auto; bottom: 70px; transform: none; width: 40px; height: 40px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="glyphbox"><img id="glyph" alt=""></div>
    <div class="num"><b id="lvl">u1</b>Bolontiku</div>
    <div class="caption" id="cap"></div>
    <div class="facts">
      <div><span>Subject</span><b id="subj"></b></div>
      <div><span>Scale in space</span><div id="space"></div></div>
      <div><span>Scale in time</span><div id="time"></div></div>
      <div><span>Maize stage (Gronemeyer 2006)</span><div id="maize"></div></div>
    </div>
    <div class="levels" id="levels"></div>
  </aside>
  <main>
    <div class="stage"><img id="photo" alt=""></div>
    <div class="title" id="ptitle"></div>
    <div class="credit" id="credit"></div>
    <div class="bar"><button class="play" id="play">Play</button><div class="dots" id="dots"></div><span class="hint">← → keys</span></div>
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <button class="nav next" id="next" aria-label="Next">›</button>
  </main>
</div>

const fileUrl = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f.replace(/ /g, '_')) + '?width=1600';

const $ = id => document.getElementById(id);
let cur = 0, timer = null;
const lv = $('levels'), dots = $('dots');
for (let L = 1; L <= 9; L++) { const b = document.createElement('button'); b.textContent = 'u' + L; b.onclick = () => go(SLIDES.findIndex(s => s[0] === L)); lv.appendChild(b); }

function go(i) {

  $('cap').textContent = '“' + d.cap + '”'; $('subj').textContent = d.subj; $('space').textContent = d.space; $('time').textContent = d.time; $('maize').textContent = d.maize;

  $('credit').innerHTML = 'Image: ' + artist.replace(/&/g, '&amp;') + ' · ' + licHtml + ' · <a href="' + pageUrl(file) + '" target="_blank" rel="noopener">Wikimedia Commons</a>';

$('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
